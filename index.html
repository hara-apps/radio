<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Радио · Гробовщик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета приезжают из Telegram (themeParams) и подставляются в эти переменные. Здесь
     дефолт на случай, если SDK не загрузился: тёмный, как основная тема клиента. */
  :root {
    color-scheme: dark;
    --bg: #17212b; --fg: #f5f5f5; --hint: #8a9aa9; --card: #1d2733;
    --line: #26313d; --accent: #5eb5f7; --accent-fg: #ffffff; --danger: #e86a6a;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    /* место под плеер: он приклеен снизу и не должен накрывать последнюю станцию */
    padding-bottom: calc(92px + var(--safe-b));
  }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 12px 6px; }
  /* ПЕРЕКЛЮЧАТЕЛЬ РАЗДЕЛОВ. Показывается ТОЛЬКО когда есть что переключать: без
     podcasts.json одинокая вкладка «Радио» это шум, а не навигация. */
  /* ЧЕТЫРЕ РАЗДЕЛА В ОДНУ СТРОКУ. Замер в браузере на 320px (iPhone SE) и 390px в двух
     языках: с эмодзи подписи «Подкасты» и «Музыка» обрезаются и страница едет вбок,
     ТОЛЬКО СЛОВАМИ - влезает всё и шапка ниже на 14px. Эмодзи остались на чипах
     фильтров и на кнопках бота, там места хватает. */
  #tabs { display: none; gap: 4px; margin-bottom: 8px; }
  #tabs.on { display: flex; }
  #tabs .chip {
    flex: 1 1 0; text-align: center; padding: 7px 4px; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #q {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-size: 16px;  /* 16px = iOS не зумит */
  }
  #q::placeholder { color: var(--hint); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; background: var(--card);
    color: var(--fg); border: 1px solid var(--line); font-size: 14px; cursor: pointer;
    user-select: none; min-height: 34px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  main { flex: 1 1 auto; padding: 4px 12px 12px; }
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 12px 10px; margin-bottom: 6px; border-radius: 10px; cursor: pointer;
    background: var(--card); border: 1px solid transparent; color: var(--fg);
    font: inherit; min-height: 56px;   /* палец, а не курсор */
  }
  .row[aria-current="true"] { border-color: var(--accent); }
  .row .nm { flex: 1 1 auto; min-width: 0; }
  .row .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .t2 { color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .eq { flex: 0 0 auto; width: 18px; color: var(--accent); }
  .note { color: var(--hint); padding: 24px 8px; text-align: center; }
  .note b { color: var(--fg); display: block; margin-bottom: 6px; }
  /* подпись под списком: тихая строка внизу, не экран. Тем же кеглем, что и мета станции */
  .foot { color: var(--hint); font-size: 12px; padding: 14px 10px 4px; line-height: 1.35; }
  .retry {
    margin-top: 12px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font: inherit; cursor: pointer;
  }
  /* ПЛЕЕР. Приклеен снизу: переключать станции и не терять управление воспроизведением. */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + var(--safe-b));
    display: none; gap: 10px; align-items: center;
  }
  #bar.on { display: flex; }
  #play {
    flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--accent-fg); font-size: 21px; cursor: pointer;
  }
  #play:disabled { opacity: .5; }
  #meta { flex: 1 1 auto; min-width: 0; }
  #bnm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bst { color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* отказ переносится на две строки: обрезанное многоточием «станция не отвеч...» это
     ровно тот текст, ради читаемости которого сторож и написан */
  #bst.err { color: var(--danger); white-space: normal; overflow: visible; }
  #vol { flex: 0 0 92px; accent-color: var(--accent); }
  #vol.off { display: none; }        /* iOS: громкость только системная, мёртвый ползунок не показываем */
  /* ОБЛОЖКА. Квадрат со скруглением, буква по центру - если логотипа нет или он битый.
     Размер задаётся в коде: один и тот же элемент служит и списку, и плееру. */
  .ava {
    flex: 0 0 auto; border-radius: 9px; overflow: hidden; background: var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--hint); font-weight: 700; font-size: 17px; line-height: 1;
  }
  .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* ПОЛНОЭКРАННЫЙ ПЛЕЕР. Мини-бар остаётся для переключения станций, а сюда человек
     заходит «послушать»: большая обложка, крупное имя, состояние словами. */
  #full {
    position: fixed; inset: 0; z-index: 20; background: var(--bg);
    display: none; flex-direction: column; align-items: center;
    padding: 24px 20px calc(24px + var(--safe-b)); text-align: center;
  }
  #full.on { display: flex; }
  #fclose {
    align-self: flex-start; background: none; border: 0; color: var(--hint);
    font-size: 28px; line-height: 1; padding: 4px 10px; cursor: pointer;
  }
  #fava { margin: 6vh auto 28px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  #fnm { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
  #fst { color: var(--hint); font-size: 15px; min-height: 22px; }
  #fst.err { color: var(--danger); }
  #fplay {
    margin-top: 32px; width: 76px; height: 76px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--accent-fg); font-size: 30px; cursor: pointer;
  }
  #fmeta { color: var(--hint); font-size: 13px; margin-top: 18px; }
  /* РЯД ДЕЙСТВИЙ. Живёт в полноэкранном плеере: там есть место под палец, и человек,
     который «слушает», уже там. В мини-баре его нет намеренно - он и так плотный. */
  #acts { display: none; gap: 8px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  #acts.on { display: flex; }
  #acts button {
    min-width: 56px; min-height: 44px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
    font: inherit; font-size: 18px; cursor: pointer;
  }
  #acts button:active { background: var(--accent); color: var(--accent-fg); }
  #actnote { color: var(--hint); font-size: 12px; margin-top: 10px; min-height: 16px; }
  /* ПЕРЕМОТКА. Живёт по признаку КОНЕЧНОЙ длительности, а не по номеру вкладки: у
     эфира duration = Infinity, и перематывать там физически нечего. Признак берётся у
     самого файла, поэтому разойтись с реальностью не может. */
  #seek { display: none; width: min(100%, 420px); margin-top: 22px; }
  #seek.on { display: block; }
  #pos { width: 100%; accent-color: var(--accent); }
  .times { display: flex; justify-content: space-between; color: var(--hint); font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div id="tabs"></div>
  <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false">
</header>
<div class="chips" id="chips"></div>

<main>
  <div id="list"></div>
  <div id="note" class="note hidden"></div>
</main>

<div id="bar">
  <div id="bava" class="ava" style="width:44px;height:44px"></div>
  <button id="play" type="button">▶</button>
  <div id="meta"><div id="bnm"></div><div id="bst"></div></div>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="1">
</div>

<div id="full">
  <button id="fclose" type="button" aria-label="закрыть">⌄</button>
  <div id="fava" class="ava" style="width:min(62vw,260px);height:min(62vw,260px)"></div>
  <div id="fnm"></div>
  <div id="fst"></div>
  <div id="seek">
    <input id="pos" type="range" min="0" max="1000" step="1" value="0">
    <div class="times"><span id="tcur">0:00</span><span id="tall">0:00</span></div>
  </div>
  <button id="fplay" type="button">▶</button>
  <div id="fmeta"></div>
  <div id="acts"></div>
  <div id="actnote"></div>
</div>

<audio id="a" preload="none"></audio>

<script>
/* ═══ РАДИО: НЕПРЕРЫВНЫЙ ЭФИР ВНУТРИ TELEGRAM ═══════════════════════════════════════
   Зачем страница существует. В чат Bot API умеет отдавать только ФАЙЛЫ, а файл конечен,
   поэтому «непрерывное радио в чате» физически недостижимо - в боте живёт честное превью
   куском. Непрерывно играть умеет обычный <audio> в вебвью, что и делает эта страница.

   ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. (1) Поток НЕ проксируется: <audio> ходит на сервер станции
   напрямую. Пропускать чужой эфир через себя это ретрансляция и публичное исполнение,
   решение Ren - никогда. (2) Обратного канала в бота нет: sendData работает только у
   аппки, открытой кнопкой reply-клавиатуры, а нас открывают ссылкой startapp. Поэтому
   избранное живёт в БОТЕ, здесь его нет вовсе - лучше отсутствие кнопки, чем кнопка,
   которая молча ничего не сохраняет. (3) User-Agent для radio-browser не выставляется:
   из браузера это forbidden header, JS его не меняет (их собственный плеер работает так же). */
(function () {
'use strict';

var TG = (window.Telegram && window.Telegram.WebApp) || null;

/* ─── ЯЗЫК. Пин языка живёт в боте, но сюда он не доезжает: роутер startapp не передаёт
   ничего, кроме имени аппки, а передеплой роутера - чужая дорожка. Берём язык клиента:
   для страницы из двух десятков строк этого достаточно. */
/* ПАРАМЕТРЫ ССЫЛКИ. Бот открывает страницу кнопкой web_app с ПОЛНЫМ адресом, поэтому
   сюда доезжает всё, что он захотел сказать: какой экран открыть, на каком языке, какие
   станции показать. Через роутер startapp этого было не выразить - он проносит только
   имя аппки. */
var Q = (function () {
  try { return new URLSearchParams(location.search); } catch (e) { return null; }
})();
function qp(name) { try { return (Q && Q.get(name)) || ''; } catch (e) { return ''; } }

/* ЯЗЫК: ПИН БОТА ГЛАВНЕЕ ЯЗЫКА КЛИЕНТА. Человек мог выбрать язык в боте явно, и страница,
   спорящая с этим выбором, выглядит поломкой. Нет пина - берём язык клиента, как раньше. */
var LANG = (function () {
  var p = qp('lang').slice(0, 2).toLowerCase();
  if (p === 'ru' || p === 'en') return p;
  var c = '';
  try { c = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user || {}).language_code || ''; } catch (e) {}
  c = (c || navigator.language || 'ru').slice(0, 2).toLowerCase();
  return c === 'ru' ? 'ru' : 'en';
})();

var STR = {
  search:    { ru: 'Поиск станции',            en: 'Search stations' },
  loading:   { ru: 'Ищу станции...',           en: 'Looking for stations...' },
  empty_h:   { ru: 'Ничего не нашлось',        en: 'Nothing found' },
  empty_b:   { ru: 'Попробуй другую страну, жанр или название.',
               en: 'Try another country, genre or name.' },
  down_h:    { ru: 'Каталог не отвечает',      en: 'The catalog is not responding' },
  down_b:    { ru: 'Это сторона radio-browser, не твоя. Можно попробовать ещё раз.',
               en: 'That is radio-browser side, not yours. You can try again.' },
  retry:     { ru: 'Ещё раз',                  en: 'Try again' },
  ms_artist: { ru: 'Радио · Гробовщик',        en: 'Radio · The Undertaker' },
  kbps:      { ru: '{n} кбит/с',               en: '{n} kbps' },
  ready:     { ru: 'готово, жми ▶',            en: 'ready, hit ▶' },
  conn:      { ru: 'соединяюсь...',            en: 'connecting...' },
  playing:   { ru: 'играет',                   en: 'on air' },
  paused:    { ru: 'пауза',                    en: 'paused' },
  dead:      { ru: 'станция не отвечает, попробуй другую',
               en: 'station is not responding, try another' },
  /* станций в каталоге много, но по https отдают не все, а http-поток на https-странице
     браузер режет как mixed content - молчаливо и без единого события. Поэтому такие
     станции в список не попадают вовсе, и это надо СКАЗАТЬ, иначе «где Радио Рекорд» */
  https_h:   { ru: 'В плеере только https-станции', en: 'Player shows https stations only' },
  https_b:   { ru: 'Остальные браузер внутри Telegram играть не даст. В чате у Гробовщика ' +
                   'играется любая, куском по три минуты.',
               en: 'The rest are blocked by the browser inside Telegram. In the chat with ' +
                   'the Undertaker any station plays, in three-minute pieces.' },
  /* ── ПОДКАСТЫ ── */
  tab_radio: { ru: '📻 Радио',                  en: '📻 Radio' },
  tab_pod:   { ru: '🎙 Подкасты',               en: '🎙 Podcasts' },
  p_search:  { ru: 'Поиск шоу в каталоге',      en: 'Search shows in the catalog' },
  p_all:     { ru: 'Все',                       en: 'All' },
  p_back:    { ru: 'Назад к шоу',               en: 'Back to shows' },
  /* СКЛОНЕНИЕ, А НЕ «{n} выпусков»: «2 выпусков» в подписи под каждым шоу читается как
     недоделка. У русского три формы, у английского две - поэтому формы лежат в реестре,
     а не собираются условием в коде. */
  p_eps_1:   { ru: 'выпуск',                    en: 'episode' },
  p_eps_2:   { ru: 'выпуска',                   en: 'episodes' },
  p_eps_5:   { ru: 'выпусков',                  en: 'episodes' },
  p_empty_h: { ru: 'Шоу не нашлось',            en: 'No shows found' },
  p_empty_b: { ru: 'Попробуй другую тему или название.',
               en: 'Try another topic or name.' },
  /* СВЕЖЕСТЬ КАТАЛОГА НАЗЫВАЕТСЯ ЧЕСТНО. Ключ каталога подписывает запросы секретом, а
     страница лежит статикой - секрет в неё не положить, поэтому здесь СНИМОК, собранный
     ботом при выкладке. Живой поиск по всему каталогу остаётся в чате, и это сказано. */
  p_built:   { ru: 'Каталог собран {d}. Живой поиск по всему каталогу идёт в чате у Гробовщика.',
               en: 'Catalog built {d}. Live search over the whole catalog is in the chat ' +
                   'with the Undertaker.' },
  ms_pod:    { ru: 'Подкаст · Гробовщик',       en: 'Podcast · The Undertaker' },
  /* ── МУЗЫКА И КНИГИ ── */
  tab_music: { ru: 'Музыка',                    en: 'Music' },
  tab_book:  { ru: 'Книги',                     en: 'Books' },
  tab_radio2: { ru: 'Радио',                    en: 'Radio' },
  tab_pod2:  { ru: 'Подкасты',                  en: 'Podcasts' },
  m_search:  { ru: 'Поиск трека в подборке',    en: 'Search the selection' },
  b_search:  { ru: 'Поиск книги в каталоге',    en: 'Search the catalog' },
  m_empty_h: { ru: 'Треков не нашлось',         en: 'No tracks found' },
  m_empty_b: { ru: 'Попробуй другой жанр. Поиск по всей библиотеке идёт в чате.',
               en: 'Try another genre. Search over the whole library is in the chat.' },
  b_empty_h: { ru: 'Книг не нашлось',           en: 'No books found' },
  b_empty_b: { ru: 'Попробуй другую тему или автора.',
               en: 'Try another topic or author.' },
  m_built:   { ru: 'Подборка собрана {d}. Живой поиск по всей библиотеке идёт в чате.',
               en: 'Selection built {d}. Live search over the whole library is in the chat.' },
  b_chapters_1: { ru: 'глава',                  en: 'chapter' },
  b_chapters_2: { ru: 'главы',                  en: 'chapters' },
  b_chapters_5: { ru: 'глав',                   en: 'chapters' },
  b_back:    { ru: 'Назад к книгам',            en: 'Back to books' },
  ms_music:  { ru: 'Музыка · Гробовщик',        en: 'Music · The Undertaker' },
  ms_book:   { ru: 'Аудиокнига · Гробовщик',    en: 'Audiobook · The Undertaker' },
  /* Атрибуция обязательна там, где лицензия её требует (CC). Строка короткая и стоит
     под именем трека - она часть условия, на котором нам этот файл разрешили. */
  lic:       { ru: 'лицензия: {l}',             en: 'licence: {l}' },
  a_like:    { ru: 'Нравится',                  en: 'Like' },
  a_no:      { ru: 'Не нравится',                en: 'Dislike' },
  a_star:    { ru: 'В избранное',                en: 'To favourites' },
  a_rec:     { ru: 'Записать кусок',             en: 'Record a piece' },
  a_dj:      { ru: 'Диджей',                     en: 'DJ' },
  /* ЧЕСТНО ПРО ПЕРЕХОД: любое действие уходит боту через Telegram, и плеер на секунду
     свернётся. Сказать это заранее дешевле, чем оставить человека гадать, куда его унесло. */
  a_hint:    { ru: 'Уйдёт боту в чат, плеер свернётся на секунду',
               en: 'Goes to the bot in the chat, the player folds away for a second' },
  a_sent:    { ru: 'Отправил боту',              en: 'Sent to the bot' },
  fav_tab:   { ru: '⭐ Избранное',                en: '⭐ Favourites' },
  fav_empty_h: { ru: 'Избранного нет',            en: 'No favourites' },
  fav_empty_b: { ru: 'Открой станцию и жми «В избранное» тут или в чате.',
                 en: 'Open a station and tap "To favourites" here or in the chat.' },
  fav_h:     { ru: 'Избранное не открылось',    en: 'Favourites did not open' },
  fav_b:     { ru: 'Каталог не отдал эти станции. Открой список в чате.',
               en: 'The catalog did not return these stations. Open the list in the chat.' }
};
function t(k) { return (STR[k] || {})[LANG] || (STR[k] || {}).ru || ''; }

/* ─── ФИЛЬТРЫ. ТОТ ЖЕ реестр, что у бота (music_sources.RADIO_COUNTRIES / RADIO_TAGS):
   расхождение значило бы, что в чате и в плеере разное радио. Связь держит тест
   ra03 - он сверяет эти строки с питоновским реестром и краснеет на расхождении. */
var FILTERS = [
  { id: 'ru',         cc: 'RU', ru: 'Россия',    en: 'Russia' },
  { id: 'ua',         cc: 'UA', ru: 'Украина',   en: 'Ukraine' },
  { id: 'kz',         cc: 'KZ', ru: 'Казахстан', en: 'Kazakhstan' },

var API = 'https://all.api.radio-browser.info';   // пул сам балансирует по нодам
var LIMIT = 40;
var LS_LAST = 'hara_radio_last';
var LS_VOL = 'hara_radio_vol';
var LS_POS = 'hara_pod_pos';        /* докуда дослушан выпуск: час звука за один заход не слушают */
/* СНИМКИ КАТАЛОГОВ. Секрет в статическую страницу не положить (у PodcastIndex каждый
   запрос подписан ключом), а книги и музыка лежат за CORS чужих хостов - поэтому все три
   каталога собирает бот при выкладке и кладёт файлами рядом. Реестр один: новый раздел
   это строка, а не ещё один почти такой же кусок кода.
   kind='cat' - два уровня (шоу -> выпуски), kind='flat' - один (трек играет сразу). */
var SECTIONS = [

    ph: 'b_search', artist: 'ms_book', back: 'b_back',
    units: ['b_chapters_1', 'b_chapters_2', 'b_chapters_5'] }
];
function section(id) {
  for (var i = 0; i < SECTIONS.length; i++) { if (SECTIONS[i].id === id) return SECTIONS[i]; }
  return SECTIONS[0];
}

var $ = function (id) { return document.getElementById(id); };

var audio = $('a');

              ptopic: '', pshow: null };

/* ═══ ТЕМА TELEGRAM ═══ */
function applyTheme() {
  if (!TG) return;
  var p = TG.themeParams || {}, r = document.documentElement.style;
  var map = { '--bg': p.bg_color, '--fg': p.text_color, '--hint': p.hint_color,
              '--card': p.secondary_bg_color, '--accent': p.button_color,
              '--accent-fg': p.button_text_color, '--line': p.section_separator_color };
  for (var k in map) { if (map[k]) r.setProperty(k, map[k]); }
  if (p.secondary_bg_color && !p.section_separator_color) r.setProperty('--line', p.secondary_bg_color);
  try { document.documentElement.style.colorScheme = TG.colorScheme || 'dark'; } catch (e) {}
}

/* ═══ КАТАЛОГ ═══ */
function stationOf(row) {
  /* url_resolved уже прошёл редиректы - именно его отдаёт плееру и бот */
  var url = (row.url_resolved || row.url || '').trim();
  /* MIXED CONTENT: страница на https, и http-поток браузер заблокирует молча. Такую
     станцию честнее не показывать, чем показать неиграющей. */
  if (url.slice(0, 8) !== 'https://') return null;
  /* ОБЛОЖКА - ТОЛЬКО https и только если она вообще есть. Тот же mixed content, что у
     потока: http-картинку браузер молча заблокирует, и вместо логотипа будет дырка.
     Мёртвую ссылку ловим уже в разметке (onerror -> буква), потому что «битая картинка»
     у radio-browser встречается чаще, чем хотелось бы. */
  var ico = (row.favicon || '').trim();
  if (ico.slice(0, 8) !== 'https://') ico = '';
  var st = { id: (row.stationuuid || '').slice(0, 36), name: (row.name || '?').trim().slice(0, 60),
             url: url, country: (row.countrycode || '').toUpperCase().slice(0, 2),
             bitrate: parseInt(row.bitrate, 10) || 0, tags: (row.tags || '').slice(0, 60),
             icon: ico, artist: t('ms_artist') };
  /* ВТОРАЯ СТРОКА СОБИРАЕТСЯ ОДИН РАЗ, здесь. Раньше её строили и список, и полноэкранный
     каждый по-своему, и «кбит/с» уже разъехалось: в списке оно было латиницей всегда. */
  st.sub = [st.country, st.bitrate ? t('kbps').replace('{n}', st.bitrate) : '', st.tags]
    .filter(Boolean).join(' · ');
  return st;
}

/* ═══ ПОДКАСТЫ ═══════════════════════════════════════════════════════════════════════
   Каталог тут СТАТИЧЕСКИЙ и это осознанно. Запрос к PodcastIndex подписывается СЕКРЕТОМ,
   а страница лежит на Pages голой статикой - положить в неё ключ значит его опубликовать.
   Своего бэкенда у аппки нет, поэтому снимок собирает бот при выкладке (podcasts.snapshot)
   и кладёт файлом рядом. Живой поиск по всему каталогу остаётся в чате, где ключ на месте,
   и в подписи под списком это сказано прямо вместе с датой сборки. */
function mmss(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return h ? (h + ':' + p(m) + ':' + p(s)) : (m + ':' + p(s));
}

function epsWord(n, units) {
  /* СКЛОНЕНИЕ ПО ФОРМАМ РАЗДЕЛА: у подкастов выпуски, у книг главы. Формы лежат в
     реестре строк (три у русского, две у английского), а не собираются условием. */
  units = units || ['p_eps_1', 'p_eps_2', 'p_eps_5'];
  if (LANG !== 'ru') return n + ' ' + t(n === 1 ? units[0] : units[2]);
  var a = n % 100, b = n % 10;
  if (a >= 11 && a <= 14) return n + ' ' + t(units[2]);        /* 11-14 всегда мн. число */
  if (b === 1) return n + ' ' + t(units[0]);
  if (b >= 2 && b <= 4) return n + ' ' + t(units[1]);
  return n + ' ' + t(units[2]);
}

function epItem(sh, ep, sec) {
  /* ВЫПУСК В ТОЙ ЖЕ ФОРМЕ, ЧТО И СТАНЦИЯ: плеер, обложка, локскрин и мини-бар не должны
     знать, что играет. Иначе каждая новая мелочь чинилась бы дважды. */
  return { id: (sec ? sec.id : 'p') + ':' + sh.id + ':' + ep.id, name: ep.title, url: ep.url,
           icon: sh.image || '', artist: sh.title, pod: true, sec: ep.sec || 0,
           sub: [ep.sec ? mmss(ep.sec) : '', sh.title].filter(Boolean).join(' · ') };
}

function trackItem(tr) {
  /* ТРЕК ИГРАЕТ СРАЗУ: второго уровня у него нет, и выдумывать его ради единообразия
     значит заставить человека тапать дважды там, где хватает одного.
     АТРИБУЦИЯ СТОИТ В ПОДПИСИ, а не «где-нибудь»: у части источников это условие
     лицензии, на котором нам файл и разрешили. */
  return { id: 'm:' + tr.id, name: tr.title, url: tr.url, icon: '', artist: tr.artist,
           pod: true, sec: tr.sec || 0,
           sub: [tr.sec ? mmss(tr.sec) : '', tr.artist,
                 tr.license ? t('lic').replace('{l}', tr.license) : ''].filter(Boolean).join(' · ') };
}

function loadSnapshots() {
  /* Один запрос на раздел, на старте. НЕТ ФАЙЛА - НЕТ И ВКЛАДКИ: раздел, который
     открывается в пустоту, хуже отсутствующего (то же правило, что у кнопки плеера в
     боте, которой нет без выложенной страницы).
     ХЭШ В АДРЕСЕ, А НЕ ТОЛЬКО no-cache: страница и её данные обновляются ОДНИМ деплоем,
     и закэшированный каталог рядом со свежей страницей это тот же «изменений не видно»,
     только тише. Разделы независимы: упавший каталог книг не уносит подкасты. */
  var jobs = SECTIONS.filter(function (s) { return s.file; }).map(function (sec) {
    return fetch(sec.file + '?v=' + encodeURIComponent(VERSION), { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return;
        var rows = sec.kind === 'flat' ? j.tracks : j.shows;
        if (!rows || !rows.length) return;
        DATA[sec.id] = j;
      })
      .catch(function () { /* нет файла - раздела просто не будет */ });
  });
  return Promise.all(jobs).then(function () {
    paintTabs();
    /* ЭКРАН ИЗ ССЫЛКИ ОТКРЫВАЕТСЯ ПОСЛЕ ЗАГРУЗКИ КАТАЛОГОВ, а не до: до неё вкладки ещё
       нет, и переключаться было бы некуда. */
    openScreen(qp('screen'));
  });
}

/* ═══ ЭКРАН ИЗ ССЫЛКИ (B3) ═══════════════════════════════════════════════════════════
   Бот открывает страницу кнопкой web_app с полным адресом и говорит, что показать.
   screen=favorites несёт ещё и список станций: обратного канала у аппки нет (sendData
   работает только у reply-кнопки), поэтому избранное приезжает В АДРЕСЕ. */
function openScreen(scr) {
  scr = (scr || '').toLowerCase();
  if (!scr || scr === 'radio') return;
  if (scr === 'favorites') { showFav(qp('fav')); return; }
  var sec = null, i;
  for (i = 0; i < SECTIONS.length; i++) {
    /* имена вкладок в ссылке человеческие (podcasts/books/music), внутри короткие */
    if (SECTIONS[i].id === scr || SECTIONS[i].file === scr + '.json') { sec = SECTIONS[i]; break; }
  }
  if (!sec || !DATA[sec.id]) return;      /* каталога нет - молча остаёмся на радио */
  switchTo(sec.id);
}

var LS_FAV = 'hara_fav_ids';


function favIds() {
  /* Избранное = то, что прислал бот в адресе, ПЛЮС отмеченное прямо тут. Локальная часть
     нужна, чтобы ⭐ в плеере давала видимый результат СРАЗУ: сигнал уже уехал боту, но
     обратно он вернётся только при следующем открытии, а чип должен появиться сейчас. */
  var out = (qp('fav') || '').split(',').filter(Boolean);
  try {
    var mine = JSON.parse(localStorage.getItem(LS_FAV) || '[]');
    mine.forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); });
  } catch (e) {}
  return out.slice(0, 40);
}


function rememberFav(id) {
  if (!id) return;
  try {
    var mine = JSON.parse(localStorage.getItem(LS_FAV) || '[]');
    if (mine.indexOf(id) < 0) { mine.push(id); }
    localStorage.setItem(LS_FAV, JSON.stringify(mine.slice(-40)));
  } catch (e) {}
}


function showFav(list) {
  /* Станции приезжают списком uuid, а не целиком: адрес кнопки не резиновый. Разворачиваем
     их через тот же каталог, которым пользуется весь раздел. */
  var ids = (list || '').split(',').filter(Boolean).slice(0, 40);
  if (!ids.length) return;
  state.mode = 'radio'; state.q = ''; state.pshow = null;
  paintTabs(); paintChips();
  var my = ++state.seq;
  showNote(t('loading'));
  fetch(API + '/json/stations/byuuid?uuids=' + encodeURIComponent(ids.join(',')))
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (rows) {
      if (my !== state.seq) return;
      var out = [], i, st;
      for (i = 0; i < rows.length; i++) { st = stationOf(rows[i]); if (st && st.id) out.push(st); }
      if (!out.length) { showNote(t('fav_empty_h'), t('fav_empty_b')); return; }
      state.items = out;
      render();
    })
    .catch(function () {
      if (my !== state.seq) return;
      showNote(t('fav_h'), t('fav_b'));
    });
}

function loadSection() {
  /* ОДИН ЗАГРУЗЧИК НА ВСЕ СНИМКИ. Разделов уже три (подкасты, музыка, книги), и три копии
     «отфильтровать по теме, отфильтровать по поиску, отрисовать» разошлись бы на первой
     же правке. Сети тут нет вовсе: снимок уже в памяти. */
  var sec = section(state.mode), snap = DATA[sec.id];
  if (!snap) { state.items = []; render(); return; }
  var q = state.q.toLowerCase();

  if (sec.kind === 'flat') {                       /* музыка: трек играет сразу */
    state.items = (snap.tracks || []).filter(function (tr) {
      if (state.ptopic && tr.topic !== state.ptopic) return false;
      if (!q) return true;
      return (tr.title + ' ' + (tr.artist || '')).toLowerCase().indexOf(q) >= 0;
    }).map(trackItem);
    render();
    return;
  }

  if (state.pshow) {                               /* внутри шоу/книги: выпуски или главы */
    var eps = (state.pshow.eps || []).map(function (e) { return epItem(state.pshow, e, sec); });
    /* ВОЗВРАТ ПЕРВОЙ СТРОКОЙ СПИСКА, а не кнопкой где-то ещё: список длинный, и уводить
       палец наверх ради выхода неудобно ровно там, где выходят чаще всего. */
    eps.unshift({ id: 'back', name: '⬅ ' + t(sec.back || 'p_back'), sub: '', icon: '',
                  tap: function () { state.pshow = null; load(); } });
    state.items = eps;
    render();
    return;
  }
  state.items = (snap.shows || []).filter(function (sh) {
    if (state.ptopic && sh.topic !== state.ptopic) return false;
    if (!q) return true;
    return (sh.title + ' ' + (sh.author || '')).toLowerCase().indexOf(q) >= 0;
  }).map(function (sh) {
    return { id: 's' + sh.id, name: sh.title, icon: sh.image || '',
             sub: [sh.author, epsWord((sh.eps || []).length, sec.units)]
               .filter(Boolean).join(' · '),
             tap: function () { state.pshow = sh; load(); } };
  });
  render();
}

function load() {
  if (state.mode !== 'radio') { loadSection(); return; }
  var my = ++state.seq;                       /* гонка: отвечает только последний запрос */
  showNote(t('loading'));
  var p = new URLSearchParams({ limit: String(LIMIT * 4), hidebroken: 'true',
                                order: 'clickcount', reverse: 'true' });
  if (state.q) {
    p.set('name', state.q.slice(0, 60));
  } else {
    var f = null, i;
    for (i = 0; i < FILTERS.length; i++) { if (FILTERS[i].id === state.filter) { f = FILTERS[i]; break; } }
    if (f && f.tag) p.set('tag', f.tag);
    if (f && f.cc) p.set('countrycode', f.cc);
  }
  var ctl = new AbortController();
  var tmo = setTimeout(function () { ctl.abort(); }, 12000);
  fetch(API + '/json/stations/search?' + p.toString(), { signal: ctl.signal })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (rows) {
      clearTimeout(tmo);
      if (my !== state.seq) return;
      var out = [], seen = {}, i, st;
      for (i = 0; i < rows.length && out.length < LIMIT; i++) {
        st = stationOf(rows[i]);
        if (!st || !st.id) continue;
        var key = st.name.toLowerCase();
        if (seen[key]) continue;
        seen[key] = 1;
        out.push(st);
      }
      state.items = out;
      render();
    })
    .catch(function (e) {
      clearTimeout(tmo);
      if (my !== state.seq) return;
      state.items = [];
      showNote(t('down_h'), t('down_b'), true);
    });
}

/* ═══ ОТРИСОВКА ═══ */
function showNote(head, body, retry) {
  elList.innerHTML = '';
  elNote.className = 'note';
  elNote.innerHTML = '';
  var b = document.createElement('b');
  b.textContent = head;
  elNote.appendChild(b);
  if (body) { var d = document.createElement('div'); d.textContent = body; elNote.appendChild(d); }
  if (retry) {
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'retry'; btn.textContent = t('retry');
    btn.addEventListener('click', load);
    elNote.appendChild(btn);
  }
}

function avatar(st, size) {
  /* Обложка станции или буква её имени. ОДНА функция на список и на плеер: две копии
     правила «как выглядит станция без логотипа» однажды разойдутся. */
  var box = document.createElement('div');
  box.className = 'ava';
  box.style.width = box.style.height = size + 'px';
  if (st.icon) {
    var img = document.createElement('img');
    img.src = st.icon;
    img.alt = '';
    img.loading = 'lazy';
    /* битая обложка не должна оставлять дырку: молча уступаем место букве */
    img.onerror = function () { img.remove(); box.textContent = (st.name[0] || '?').toUpperCase(); };
    box.appendChild(img);
  } else {
    box.textContent = (st.name[0] || '?').toUpperCase();
  }
  return box;
}


function render() {
  elNote.className = 'note hidden';
  elList.innerHTML = '';
  if (!state.items.length) {
    /* пусто после https-фильтра и пусто в каталоге - разные вещи, и человеку нужны
       разные слова: в первом случае станции есть, просто не для этой страницы */
    var _e = { radio: ['empty_h', 'empty_b'], pod: ['p_empty_h', 'p_empty_b'],
               music: ['m_empty_h', 'm_empty_b'], book: ['b_empty_h', 'b_empty_b'] };
    var _k = _e[state.mode] || _e.radio;
    showNote(t(_k[0]), t(_k[1]));
    return;
  }
  var frag = document.createDocumentFragment();
  state.items.forEach(function (st) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'row';
    if (st.url && state.cur && state.cur.id === st.id) b.setAttribute('aria-current', 'true');
    b.appendChild(avatar(st, 40));
    var nm = document.createElement('div'); nm.className = 'nm';
    var t1 = document.createElement('div'); t1.className = 't1'; t1.textContent = st.name;
    var t2 = document.createElement('div'); t2.className = 't2';
    t2.textContent = st.sub || '';
    nm.appendChild(t1); nm.appendChild(t2);
    var eq = document.createElement('div'); eq.className = 'eq';
    eq.textContent = (st.url && state.cur && state.cur.id === st.id && !audio.paused) ? '▮▮' : '';
    b.appendChild(nm); b.appendChild(eq);
    /* СТРОКА ЛИБО ИГРАЕТ, ЛИБО ВЕДЁТ. Признак - наличие url у самой строки, а не режим:
       в списке выпусков первая строка это возврат, и она не должна ничего запускать. */
    b.addEventListener('click', function () {
      if (st.url) { pick(st, true); } else if (st.tap) { st.tap(); }
    });
    frag.appendChild(b);
  });
  elList.appendChild(frag);
  /* подпись под списком идёт ТИХО: это уточнение, а не сообщение о беде */
  var hint = document.createElement('div');
  hint.className = 'foot';
  if (state.mode === 'radio') {
    hint.textContent = t('https_h') + '. ' + t('https_b');
  } else {
    /* ДАТА СБОРКИ НАЗЫВАЕТСЯ ВСЛУХ: каталог тут снимок, и человек должен понимать,
       насколько он свежий, а не догадываться. Живой поиск честно отправлен в чат. */
    var _snap = DATA[state.mode] || {}, d = '';
    try {
      d = _snap.built ? new Date(_snap.built * 1000).toLocaleDateString(
        LANG === 'ru' ? 'ru-RU' : 'en-GB') : '';
    } catch (e) { d = ''; }
    hint.textContent = d ? t(state.mode === 'music' ? 'm_built' : 'p_built')
      .replace('{d}', d) : '';
  }
  if (hint.textContent) elList.appendChild(hint);
}

/* ═══ ПЛЕЕР ═══ */
var watchdog = null;

function say(msg, err) {
  /* ОДНА функция на оба экрана: мини-бар и полноэкранный обязаны говорить одно и то же.
     Две копии «текущего состояния» разойдутся ровно тогда, когда станция отвалится. */
  elSt.textContent = msg;
  elSt.className = err ? 'err' : '';
  elFst.textContent = msg;
  elFst.className = err ? 'err' : '';
}


/* ═══ MEDIA SESSION: обложка и кнопки на локскрине ═══════════════════════════════════
   Где поддерживается (Android/Chrome) - сильно меняет ощущение: станция выглядит как
   музыка в системном плеере. Где нет (iOS-вебвью ограничен) - НИЧЕГО не ломается: весь
   блок под проверкой наличия и под try. Это ожидаемое ограничение платформы, а не баг,
   и обещать локскрин везде мы не будем. */
function mediaMeta(st) {
  if (!('mediaSession' in navigator)) return false;
  try {
    var art = [];
    if (st && st.icon) art = [{ src: st.icon, sizes: '512x512', type: 'image/png' }];
    navigator.mediaSession.metadata = new window.MediaMetadata({
      title: (st && st.name) || 'Radio',
      /* у выпуска исполнитель это ШОУ, у станции - мы: на локскрине человек должен
         видеть, что именно играет, а не одинаковую строку на любой звук */
      artist: (st && st.artist) || t(section(state.mode).artist || 'ms_artist'),
      album: (st && st.pod) ? t(section(state.mode).artist || 'ms_pod')
                            : ((st && st.country) || ''),
      artwork: art
    });
    return true;
  } catch (e) {
    console.log('media session meta: ' + e);
    return false;
  }
}


function mediaState(playing) {
  if (!('mediaSession' in navigator)) return;
  try { navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; }
  catch (e) {}
}


(function mediaActions() {
  if (!('mediaSession' in navigator)) return;
  /* Каждый обработчик ставится ОТДЕЛЬНО: набор поддерживаемых действий у клиентов
     разный, и один неизвестный не должен уносить остальные (throws TypeError). */
  var acts = [['play', function () { if (state.cur) start(); }],
              ['pause', function () { stopWatch(); audio.pause(); }],
              ['stop', function () { stopWatch(); audio.pause(); }]];
  for (var i = 0; i < acts.length; i++) {
    try { navigator.mediaSession.setActionHandler(acts[i][0], acts[i][1]); }
    catch (e) { console.log('media session ' + acts[i][0] + ': не поддержан'); }
  }
})();

function stopWatch() { if (watchdog) { clearTimeout(watchdog); watchdog = null; } }

function dead() {
  /* ЧЕСТНЫЙ ОТКАЗ ВМЕСТО ВЕЧНОЙ ЗАГРУЗКИ. Станции в этом каталоге отваливаются постоянно,
     и <audio> в такой ситуации не всегда шлёт error - он просто молчит. Поэтому сторож
     по времени: не заиграло за 12 секунд - значит не заиграет. */
  stopWatch();
  try { audio.pause(); } catch (e) {}
  setPlayIcon('▶');
  mediaState(false);
  say(t('dead'), true);
  markRow();
}

function markRow() {
  var rows = elList.querySelectorAll('.row'), i;
  for (i = 0; i < rows.length; i++) {
    var on = state.cur && rows[i].querySelector('.t1').textContent === state.cur.name;
    if (on) { rows[i].setAttribute('aria-current', 'true'); } else { rows[i].removeAttribute('aria-current'); }
    rows[i].querySelector('.eq').textContent = (on && !audio.paused) ? '▮▮' : '';
  }
}

function paintFull(st) {
  /* Полноэкранный собирается ИЗ ТОЙ ЖЕ станции, что и мини-бар: он не хранит своего
     состояния и потому не может с ним разойтись. */
  elFava.innerHTML = '';
  var a = avatar(st, 0);
  a.removeAttribute('style');
  a.style.width = a.style.height = '100%';
  elFava.appendChild(a);
  elFnm.textContent = st.name;
  elFmeta.textContent = st.sub || '';
  paintActs(st);
}


function pick(st, autoplay) {
  state.cur = st;
  elBar.className = 'on';
  elNm.textContent = st.name;
  elBava.innerHTML = '';
  elBava.appendChild(avatar(st, 44));
  paintFull(st);
  mediaMeta(st);
  try { localStorage.setItem(LS_LAST, JSON.stringify(st)); } catch (e) {}
  audio.src = st.url;
  markRow();
  if (autoplay) { start(); } else { say(t('ready')); setPlayIcon('▶'); }
}

function start() {
  if (!state.cur) return;
  say(t('conn'));
  setPlayIcon('❚❚');
  stopWatch();
  watchdog = setTimeout(dead, 12000);
  var p;
  try { p = audio.play(); } catch (e) { dead(); return; }
  if (p && p.catch) {
    p.catch(function (err) {
      stopWatch();
      setPlayIcon('▶');
      /* NotAllowedError = автоплей заблокирован (iOS требует ПЕРВЫЙ play по тапу).
         Это не поломка станции, и говорить «станция не отвечает» тут нельзя. */
      if (err && err.name === 'NotAllowedError') { say(t('ready')); } else { dead(); }
    });
  }
}

$('meta').addEventListener('click', function () {
  if (state.cur) elFull.className = 'on';
});
$('bava').addEventListener('click', function () {
  if (state.cur) elFull.className = 'on';
});
$('fclose').addEventListener('click', function () { elFull.className = ''; });
elFplay.addEventListener('click', function () {
  if (!state.cur) return;
  if (audio.paused) { start(); } else { stopWatch(); audio.pause(); }
});

elPlay.addEventListener('click', function () {
  if (!state.cur) return;
  if (audio.paused) { start(); } else { stopWatch(); audio.pause(); }
});

function setPlayIcon(icon) {
  elPlay.textContent = icon;
  elFplay.textContent = icon;
}

audio.addEventListener('playing', function () {
  stopWatch(); setPlayIcon('❚❚'); say(t('playing')); mediaState(true); markRow();
});
audio.addEventListener('pause', function () {
  stopWatch(); setPlayIcon('▶'); say(t('paused')); mediaState(false); markRow();
});
audio.addEventListener('error', dead);
audio.addEventListener('stalled', function () { if (!audio.paused && !watchdog) watchdog = setTimeout(dead, 12000); });

/* ГРОМКОСТЬ. На iOS она СИСТЕМНАЯ: audio.volume там read-only, присваивание молча не
   действует. Проверяем на живом элементе и убираем мёртвый ползунок, а не делаем вид. */
(function volumeSetup() {
  var vol = 1;
  try { vol = Math.min(1, Math.max(0, parseFloat(localStorage.getItem(LS_VOL)))); } catch (e) {}
  if (!(vol >= 0 && vol <= 1)) vol = 1;
  audio.volume = 0.5;
  var works = Math.abs(audio.volume - 0.5) < 0.01;
  audio.volume = vol;
  if (!works) { elVol.className = 'off'; return; }
  elVol.value = String(vol);
  elVol.addEventListener('input', function () {
    audio.volume = parseFloat(elVol.value);
    try { localStorage.setItem(LS_VOL, elVol.value); } catch (e) {}
  });
})();

/* ═══ ДЕЙСТВИЯ ИЗ ПЛЕЕРА В БОТА ══════════════════════════════════════════════════════
   ПОЧЕМУ DEEP-LINK, А НЕ sendData. У аппки два способа сказать что-то боту, и ОБА
   прерывают прослушивание - это свойство платформы, а не наша лень:
     sendData    - работает ТОЛЬКО у аппки, открытой кнопкой reply-клавиатуры, и по
                   контракту ЗАКРЫВАЕТ аппку. Плюс нам пришлось бы сменить способ
                   открытия, потеряв параметры ссылки (screen/fav/lang, весь B3) и заняв
                   нижнее меню, где живёт подпись режима (закон №27).
     deep-link   - работает при ЛЮБОМ способе открытия, ничего не ломает, и на большинстве
                   клиентов сворачивает аппку, а не убивает: вернуться один тап.
   Выбран deep-link. Прерывание НАЗЫВАЕТСЯ человеку заранее подписью под кнопками, а не
   выясняется после первого тапа.

   ЛАЙК НЕЛЬЗЯ КОПИТЬ И СЛАТЬ ПАЧКОЙ. Опознаёт трек бот, в момент получения сигнала: к
   моменту отправки «трёх накопленных лайков» в эфире играет уже другое, и мы запомнили бы
   не тот трек. Поэтому один тап - одна отправка, и это не оптимизируется. */
function botLink(code) {
  return 'https://t.me/' + BOT + '?start=' + encodeURIComponent(code);
}

function act(code, label) {
  if (!BOT || BOT.indexOf('{{') === 0) return;
  $('actnote').textContent = t('a_sent') + ': ' + label;
  var url = botLink(code);
  try {
    if (TG && TG.openTelegramLink) { TG.openTelegramLink(url); return; }
  } catch (e) {}
  try { window.open(url, '_blank'); } catch (e) { location.href = url; }
}

function paintActs(it) {
  /* Набор кнопок зависит от того, ЧТО играет: записать можно живой эфир, а не выпуск
     подкаста, который и так лежит файлом. Диджей доступен всегда - он про настроение. */
  var box = $('acts');
  box.innerHTML = '';
  if (!BOT || BOT.indexOf('{{') === 0) { box.className = ''; return; }
  var rows = [];
  if (it && !it.pod && it.id) {
    rows.push(['👍', 'a_like', 'l' + it.id]);
    rows.push(['👎', 'a_no', 'd' + it.id]);
    rows.push(['⭐', 'a_star', 's' + it.id]);
    rows.push(['⏺', 'a_rec', 'r' + it.id]);
  }
  rows.push(['🎧', 'a_dj', 'j']);
  rows.forEach(function (r) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = r[0];
    b.title = t(r[1]);
    b.setAttribute('aria-label', t(r[1]));
    b.addEventListener('click', function () {
      if (r[2].charAt(0) === 's' && it && it.id) { rememberFav(it.id); paintChips(); }
      act(r[2], t(r[1]));
    });
    box.appendChild(b);
  });
  box.className = 'on';
  $('actnote').textContent = t('a_hint');
}

/* ═══ ПЕРЕМОТКА ══════════════════════════════════════════════════════════════════════
   Появляется по КОНЕЧНОЙ длительности источника, а не по разделу: у живого эфира
   duration = Infinity, и перематывать там нечего. Признак берётся у самого файла и
   поэтому не может разойтись с тем, что играет.
   ДОКУДА ДОСЛУШАЛ - ЗАПОМИНАЕМ: часовой выпуск за один заход не слушают, и начинать
   его сначала после каждого закрытия аппки значит не дать дослушать вовсе. */
var dragging = false;

function posKey(it) { return (it && it.pod) ? (LS_POS + ':' + it.id) : ''; }

function savePos() {
  var k = posKey(state.cur);
  if (!k || !isFinite(audio.duration) || audio.currentTime < 30) return;
  /* дослушанное до конца НЕ запоминаем: иначе следующий заход откроется на титрах */
  try {
    if (audio.duration - audio.currentTime < 30) { localStorage.removeItem(k); }
    else { localStorage.setItem(k, String(Math.floor(audio.currentTime))); }
  } catch (e) {}
}

function paintSeek() {
  var ok = isFinite(audio.duration) && audio.duration > 0;
  elSeek.className = ok ? 'on' : '';
  if (!ok) return;
  if (!dragging) elPos.value = String(Math.round(audio.currentTime / audio.duration * 1000));
  elTcur.textContent = mmss(audio.currentTime);
  elTall.textContent = mmss(audio.duration);
}

elPos.addEventListener('input', function () { dragging = true; });
elPos.addEventListener('change', function () {
  dragging = false;
  if (!isFinite(audio.duration) || !audio.duration) return;
  try { audio.currentTime = audio.duration * (parseInt(elPos.value, 10) / 1000); } catch (e) {}
});
audio.addEventListener('loadedmetadata', function () {
  paintSeek();
  var k = posKey(state.cur), was = null;
  if (!k) return;
  try { was = parseInt(localStorage.getItem(k), 10); } catch (e) {}
  if (was > 30 && isFinite(audio.duration) && was < audio.duration - 30) {
    try { audio.currentTime = was; } catch (e) {}
    paintSeek();
  }
});
audio.addEventListener('timeupdate', paintSeek);
audio.addEventListener('pause', savePos);
audio.addEventListener('ended', function () {
  var k = posKey(state.cur);
  if (k) { try { localStorage.removeItem(k); } catch (e) {} }
  setPlayIcon('▶'); mediaState(false); markRow();
});
window.addEventListener('pagehide', savePos);

/* ═══ ВКЛАДКИ, ФИЛЬТРЫ И ПОИСК ═══ */
function switchTo(id) {
  if (state.mode === id) return;
  state.mode = id; state.q = ''; elQ.value = ''; state.pshow = null; state.ptopic = '';
  paintTabs(); paintChips();
  load();
}

function paintTabs() {
  /* Вкладка есть ТОЛЬКО у раздела, чей каталог доехал: раздел, открывающийся в пустоту,
     хуже отсутствующего. Одна вкладка - переключать нечего, строку не показываем вовсе. */
  var box = $('tabs');
  box.innerHTML = '';
  var live = SECTIONS.filter(function (sec) { return sec.kind === 'live' || DATA[sec.id]; });
  if (live.length < 2) { box.className = ''; return; }
  box.className = 'on';
  live.forEach(function (sec) {
    var c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = t(sec.tab);
    c.setAttribute('aria-pressed', state.mode === sec.id ? 'true' : 'false');
    c.addEventListener('click', function () { switchTo(sec.id); });
    box.appendChild(c);
  });
}

function paintChips() {
  /* Чипы СВОИ на раздел: у радио страны и жанры, у подкастов темы из снимка. Перерисовка
     целиком проще синхронизации двух наборов - и не оставляет чужого нажатым. */
  var box = $('chips');
  box.innerHTML = '';
  var sec = section(state.mode);
  elQ.placeholder = t(sec.ph || 'search');
  var list;
  if (sec.kind === 'live') {
    /* ⭐ ИЗБРАННОЕ ОТДЕЛЬНЫМ ЧИПОМ: станции приезжают в адресе от бота (fav=) и
       дополняются тем, что человек отметил прямо здесь. Чипа нет, когда отмечать нечего -
       пустой раздел хуже отсутствующего. */
    list = FILTERS.slice();
    if (favIds().length) list.unshift({ id: 'fav', ru: t('fav_tab'), en: t('fav_tab') });
  } else {
    list = [{ id: '', ru: t('p_all'), en: t('p_all') }].concat(
      (DATA[sec.id] || {}).topics || []);
  }
  list.forEach(function (f) {
    var cur = sec.kind === 'live' ? state.filter : state.ptopic;
    var c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = f[LANG] || f.ru;
    c.setAttribute('aria-pressed', f.id === cur ? 'true' : 'false');
    c.addEventListener('click', function () {
      if (sec.kind === 'live') { state.filter = f.id; }
      else { state.ptopic = f.id; state.pshow = null; }
      if (f.id === 'fav') {
        state.q = ''; elQ.value = '';
        var all = box.querySelectorAll('.chip'), k;
        for (k = 0; k < all.length; k++) all[k].setAttribute('aria-pressed', 'false');
        c.setAttribute('aria-pressed', 'true');
        showFav(favIds().join(','));
        return;
      }
      state.q = ''; elQ.value = '';
      var all = box.querySelectorAll('.chip'), i;
      for (i = 0; i < all.length; i++) all[i].setAttribute('aria-pressed', 'false');
      c.setAttribute('aria-pressed', 'true');
      load();
    });
    box.appendChild(c);
  });
}

var qt = null;
elQ.addEventListener('input', function () {
  clearTimeout(qt);
  qt = setTimeout(function () {
    var v = elQ.value.trim();
    if (v === state.q) return;
    state.q = v;
    if (state.mode !== 'radio') state.pshow = null;  /* ищем по шоу, а не внутри открытого */
    if (v) {
      /* идёт поиск - ни один фильтр не активен, и вид не должен утверждать обратное */
      var all = $('chips').querySelectorAll('.chip'), i;
      for (i = 0; i < all.length; i++) all[i].setAttribute('aria-pressed', 'false');
    } else {
      paintChips();                                /* вернулись к фильтру - он снова нажат */
    }
    load();
  }, 400);                                    /* каталог чужой, дёргать на каждую букву невежливо */
});

/* ═══ ВЕРСИЯ И КЭШ ВЕБВЬЮ ═══════════════════════════════════════════════════════════
   Вебвью Телеграма держит страницу в кэше, и человек после деплоя видит СТАРОЕ - решает,
   что правки не доехали (живой случай Ren). Сверяем свой вшитый хэш с version.txt рядом
   и перезагружаемся ОДИН раз при расхождении.
   Защита от цикла обязательна: если version.txt почему-то всегда отличается (не доложили
   при деплое, отдаётся не тот файл), без флага страница перезагружалась бы вечно. */
var VERSION = '46b365d2d17d';
/* ИМЯ БОТА подставляется при выкладке (как и версия). Не подставлено - действий в плеере
   нет вовсе: кнопка, которой некуда уходить, хуже отсутствующей. */
var BOT = 'theundertaker_test_bot';

(function checkVersion() {
  if (VERSION.indexOf('{{') === 0) return;          /* не задеплоено - сверять не с чем */
  var KEY = 'hara_radio_reloaded';
  fetch('version.txt?t=' + VERSION, { cache: 'no-store' }).then(function (r) {
    return r.ok ? r.text() : null;
  }).then(function (v) {
    if (!v) return;
    v = v.trim();
    if (!v || v === VERSION) { try { sessionStorage.removeItem(KEY); } catch (e) {} return; }
    var once = null;
    try { once = sessionStorage.getItem(KEY); } catch (e) {}
    if (once === v) { console.log('версия ' + v + ' не подхватилась перезагрузкой'); return; }
    try { sessionStorage.setItem(KEY, v); } catch (e) {}
    console.log('страница устарела (' + VERSION + ' -> ' + v + '), перезагружаюсь');
    /* УХОДИМ НА ДРУГОЙ URL, А НЕ location.reload(). Вебвью Телеграма кэширует
       агрессивно, и reload() честно имеет право отдать ТУ ЖЕ страницу с полки - тогда
       сверка пройдёт по кругу и погаснет о защиту от цикла, оставив человека на старой
       версии (ровно то, что мы чинили). Адрес с ?v=<хэш> вебвью в кэше не находит и
       обязан сходить в сеть. Заодно это делает страницу самолечащейся: на следующем
       деплое хэш снова разойдётся, и адрес снова сменится. */
    location.replace(location.pathname + '?v=' + encodeURIComponent(v) + location.hash);
  }).catch(function () { /* нет сети - работаем тем, что есть */ });
})();

/* ═══ СТАРТ ═══ */
applyTheme();
if (TG) {
  try { TG.ready(); TG.expand(); } catch (e) {}
  try { TG.onEvent('themeChanged', applyTheme); } catch (e) {}
}
document.documentElement.lang = LANG;

/* ПОСЛЕДНЯЯ СТАНЦИЯ. Восстанавливаем и ПОКАЗЫВАЕМ готовой, но НЕ играем сами: на iOS
   первый play обязан быть по тапу, иначе браузер его отклонит - и человек увидит
   «не отвечает» там, где станция жива. Один тап честнее ложной ошибки. */
(function restore() {
  var raw = null;
  try { raw = localStorage.getItem(LS_LAST); } catch (e) {}
  if (!raw) return;
  try {
    var st = JSON.parse(raw);
    if (st && st.url && st.name) pick(st, false);
  } catch (e) {}
})();

paintTabs();
paintChips();
load();
/* каталоги подтягиваются ФОНОМ: радио обязано открыться сразу, а вкладки появятся, когда
   файлы доедут (или не появятся вовсе, если их нет). Экран из ссылки открывается там же,
   после загрузки - до неё переключаться было бы некуда. */
loadSnapshots();
})();
</script>
</body>
</html>
